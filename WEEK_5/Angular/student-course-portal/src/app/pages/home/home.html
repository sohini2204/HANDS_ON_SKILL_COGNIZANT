<div class="home-container">
  <!-- Task 1: Interpolation, Property Binding, Event Binding, Two-Way Binding (Hands-On 2) -->
  <h1>{{ portalName }}</h1>
  <p class="description">
    Welcome to the Student Course Portal. Browse courses, enroll, and track your progress.
  </p>

  <!-- Stats row with hardcoded/interpolated values -->
  <div class="stats-row">
    <div class="stat-card">
      <span class="stat-value">{{ coursesCount }}</span>
      <span class="stat-label">Courses Available</span>
    </div>
    <div class="stat-card">
      <span class="stat-value">{{ enrolledCount }}</span>
      <span class="stat-label">Enrolled</span>
    </div>
    <div class="stat-card">
      <span class="stat-value">{{ gpa }}</span>
      <span class="stat-label">GPA</span>
    </div>
  </div>

  <!-- Property binding: button disabled state -->
  <button class="btn-enroll" [disabled]="!isPortalActive" (click)="onEnrollClick()">
    Enroll Now
  </button>

  @if (message) {
    <div class="message">{{ message }}</div>
  }

  <!-- Two-way binding with ngModel -->
  <div class="search-section">
    <label for="search">Search Courses:</label>
    <input id="search" type="text" [(ngModel)]="searchTerm" placeholder="Type to search..." />
    <p>Searching for: {{ searchTerm }}</p>
    <!-- Explain the difference between [property] and [(ngModel)] -->
    <!-- [property] is one-way binding: component → DOM. [(ngModel)] is two-way: DOM ↔ component. -->
  </div>
</div>
