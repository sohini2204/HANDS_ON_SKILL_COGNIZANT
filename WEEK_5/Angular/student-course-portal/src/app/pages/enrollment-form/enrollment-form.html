<div class="enrollment-form-container">
  <h2>Enrollment Request Form</h2>

  <form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)">
    <div class="form-group">
      <label for="studentName">Student Name</label>
      <input type="text" id="studentName" name="studentName" class="form-control"
        [(ngModel)]="studentName" #nameCtrl="ngModel" required minlength="3" />
      <div class="error-messages" *ngIf="nameCtrl.touched">
        <span *ngIf="nameCtrl.errors?.['required']">Name is required</span>
        <span *ngIf="nameCtrl.errors?.['minlength']">Name must be at least 3 characters</span>
      </div>
    </div>

    <div class="form-group">
      <label for="studentEmail">Student Email</label>
      <input type="email" id="studentEmail" name="studentEmail" class="form-control"
        [(ngModel)]="studentEmail" #emailCtrl="ngModel" required email />
      <div class="error-messages" *ngIf="emailCtrl.touched">
        <span *ngIf="emailCtrl.errors?.['required']">Email is required</span>
        <span *ngIf="emailCtrl.errors?.['email']">Please enter a valid email address</span>
      </div>
    </div>

    <div class="form-group">
      <label for="courseId">Course ID</label>
      <input type="number" id="courseId" name="courseId" class="form-control"
        [(ngModel)]="courseId" #courseIdCtrl="ngModel" required />
      <div class="error-messages" *ngIf="courseIdCtrl.touched">
        <span *ngIf="courseIdCtrl.errors?.['required']">Course ID is required</span>
      </div>
    </div>

    <div class="form-group">
      <label for="preferredSemester">Preferred Semester</label>
      <select id="preferredSemester" name="preferredSemester" class="form-control"
        [(ngModel)]="preferredSemester" required>
        <option value="Odd">Odd</option>
        <option value="Even">Even</option>
      </select>
    </div>

    <div class="form-group checkbox-group">
      <label>
        <input type="checkbox" name="agreeToTerms" [(ngModel)]="agreeToTerms"
          #termsCtrl="ngModel" required />
        Agree to Terms
      </label>
      <div class="error-messages" *ngIf="termsCtrl.touched">
        <span *ngIf="termsCtrl.errors?.['required']">You must agree to the terms</span>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-submit" [disabled]="enrollForm.invalid">Submit</button>
      <button type="button" class="btn-reset" (click)="enrollForm.resetForm()">Reset</button>
    </div>
  </form>

  <div class="success-message" *ngIf="submitted">
    <p>Enrollment request submitted successfully!</p>
  </div>
</div>
